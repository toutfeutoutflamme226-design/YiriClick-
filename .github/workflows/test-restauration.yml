# Checks that the latest weekly backup can really be restored.
# Takes the latest backup, opens it with BACKUP_PASSPHRASE, restores it into a temporary empty database
# on GitHub's machine (deleted at the end), and counts the shops, products and orders found.
# Nothing touches the real database. Runs on the 1st of each month, or by hand (Run workflow).
name: Test de restauration de la sauvegarde

on:
  schedule:
    - cron: "41 4 1 * *"   # 1st of each month, 04:41 UTC
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Dernière sauvegarde
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          id=$(gh run list -R "$GITHUB_REPOSITORY" -w sauvegarde.yml --status success -L 1 --json databaseId -q '.[0].databaseId')
          if [ -z "$id" ]; then echo "::error::Aucune sauvegarde réussie trouvée."; exit 1; fi
          gh run download "$id" -R "$GITHUB_REPOSITORY" -n sauvegarde-base -D backup
          ls -l backup
          echo "::notice::Sauvegarde testée : essai n° $id du $(gh run view "$id" -R "$GITHUB_REPOSITORY" --json createdAt -q .createdAt | cut -c1-10)"
      - name: Ouvrir et restaurer dans une base temporaire
        shell: bash
        env:
          PASS: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          fail() { echo "::error::Étape « $1 » : $(tail -n 5 "$2" 2>/dev/null | tr '\n' ' ' | cut -c1-500)"; exit 1; }
          F=$(ls backup/*.gpg 2>/dev/null | head -n 1)
          [ -n "$F" ] || { echo "::error::Aucun fichier de sauvegarde téléchargé."; exit 1; }
          mkdir -p work
          gpg --batch --quiet --decrypt --passphrase "$PASS" "$F" > work/all.tar.gz 2> gpg.log || fail "ouverture avec BACKUP_PASSPHRASE" gpg.log
          tar -xzf work/all.tar.gz -C work > tar.log 2>&1 || fail "décompression" tar.log
          echo "::notice::Sauvegarde ouverte avec la phrase secrète : $(ls work | grep -c sql) fichiers SQL, $(du -sh work | cut -f1)"
          # Same Postgres as Supabase (image from Docker Hub, same major version as the backup)
          MAJ=$(grep -m1 -o "Dumped from database version [0-9]*" work/2-structure.sql | grep -o "[0-9]*$" || true); MAJ=${MAJ:-17}
          TAG=$(curl -fsSL "https://hub.docker.com/v2/repositories/supabase/postgres/tags?page_size=100&ordering=last_updated" \
            | python3 -c "import sys,json,re; m=sys.argv[1]; t=[x['name'] for x in json.load(sys.stdin)['results'] if re.fullmatch(m+r'\.[0-9]+\.[0-9]+\.[0-9]+', x['name'])]; print(t[0] if t else '')" "$MAJ")
          [ -n "$TAG" ] || { echo "::error::Image supabase/postgres $MAJ introuvable sur Docker Hub."; exit 1; }
          echo "::notice::Base temporaire : supabase/postgres:$TAG (Postgres $MAJ)"
          docker run -d --name pg -e POSTGRES_PASSWORD=postgres -p 54322:5432 "supabase/postgres:$TAG" > run.log 2>&1 || fail "démarrage de la base temporaire" run.log
          DB="postgresql://supabase_admin:postgres@127.0.0.1:54322/postgres"
          for i in $(seq 1 60); do psql "$DB" -tAc "select 1" > /dev/null 2>&1 && break; sleep 2; done
          psql "$DB" -tAc "select 1" > ready.log 2>&1 || { docker logs pg 2>&1 | tail -n 20 > ready.log; fail "démarrage de la base temporaire" ready.log; }
          # Login accounts live in the auth schema, created by Supabase's auth server: run its migrations only
          GT=$(curl -fsSL "https://hub.docker.com/v2/repositories/supabase/gotrue/tags?page_size=50&ordering=last_updated" \
            | python3 -c "import sys,json,re; t=[x['name'] for x in json.load(sys.stdin)['results'] if re.fullmatch(r'v2\.[0-9]+\.[0-9]+', x['name'])]; print(t[0] if t else '')" || true)
          if [ -n "$GT" ]; then
            docker run --rm --network host -e GOTRUE_DB_DRIVER=postgres \
              -e GOTRUE_DB_DATABASE_URL="postgres://supabase_auth_admin:postgres@127.0.0.1:54322/postgres" -e DATABASE_URL="postgres://supabase_auth_admin:postgres@127.0.0.1:54322/postgres" \
              -e GOTRUE_JWT_SECRET=test-secret-test-secret-test-secret-00 -e GOTRUE_SITE_URL=http://localhost -e API_EXTERNAL_URL=http://localhost -e GOTRUE_API_HOST=127.0.0.1 -e PORT=9999 \
              "supabase/gotrue:$GT" gotrue migrate > auth.log 2>&1 && echo "::notice::Tables des comptes créées (supabase/gotrue:$GT)" \
              || echo "::warning::Tables des comptes non créées : $(tail -n 3 auth.log | tr '\n' ' ' | cut -c1-300)"
          fi
          psql "$DB" -q -v ON_ERROR_STOP=0 -f work/1-roles.sql > roles.log 2>&1 || true
          psql "$DB" -q -v ON_ERROR_STOP=0 -f work/2-structure.sql > structure.log 2>&1 || true
          psql "$DB" -q -v ON_ERROR_STOP=0 -c 'SET session_replication_role = replica' -f work/3-donnees.sql > data.log 2>&1 || true
          es=$(grep -c "ERROR" structure.log || true); ed=$(grep -c "ERROR" data.log || true)
          echo "::notice::Erreurs pendant la restauration : structure $es, données $ed (les objets déjà fournis par Supabase sont normaux)"
          [ "$es" = "0" ] || grep -m5 "ERROR" structure.log | sed 's/^/::warning::/'
          [ "$ed" = "0" ] || grep -m5 "ERROR" data.log | sed 's/^/::warning::/'
          total=0
          for t in boutiques produits commandes avis dossiers inscriptions; do
            n=$(psql "$DB" -tAc "select count(*) from public.$t" 2>/dev/null || echo "?")
            echo "::notice::Table $t : $n ligne(s)"
            case "$n" in ''|*[!0-9]*) ;; *) total=$((total + n));; esac
          done
          u=$(psql "$DB" -tAc "select count(*) from auth.users" 2>/dev/null || echo "?")
          echo "::notice::Comptes utilisateurs retrouvés : $u"
          if [ "$total" -gt 0 ]; then echo "::notice::✅ Restauration réussie : $total lignes retrouvées dans les tables principales."; else echo "::error::Restauration incomplète : aucune ligne retrouvée."; exit 1; fi
