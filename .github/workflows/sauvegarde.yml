# Weekly encrypted backup of the Supabase database (structure + data), kept 90 days as a workflow artifact.
# The file is encrypted (AES-256) before it leaves the runner: without the passphrase it cannot be read,
# even though artifacts of a public repository can be downloaded by others.
# Requires once (Settings > Secrets and variables > Actions > New repository secret):
#   SUPABASE_ACCESS_TOKEN  (simplest) a Supabase personal access token, supabase.com/dashboard/account/tokens:
#                          the official Supabase tool then connects without the database password
#   or, without it:
#   SUPABASE_DB_URL       Supabase > Connect > "Session pooler" connection string, pasted as shown (with [YOUR-PASSWORD])
#   SUPABASE_DB_PASSWORD  the database password (Project Settings > Database); not needed if it is already in the address
#   BACKUP_PASSPHRASE     a long passphrase kept in your password manager (needed to open a backup)
# Restore: gpg --decrypt yiriclick-AAAA-MM-JJ.tar.gz.gpg | tar -xzf -   (then psql the 3 files in order into a new project)
#     or, older format: gpg --decrypt yiriclick-AAAA-MM-JJ.sql.gz.gpg | gunzip > backup.sql
name: Sauvegarde de la base

on:
  schedule:
    - cron: "23 2 * * 0"   # every Sunday, 02:23 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    env:
      HAS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN != '' }}
      PROJECT_REF: vtiakxfnechkoomagddl
    steps:
      - name: Outil officiel Supabase
        if: env.HAS_TOKEN == 'true'
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Sauvegarde chiffrée (clé d'accès Supabase)
        if: env.HAS_TOKEN == 'true'
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PASS: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ -z "$PASS" ]; then echo "::error::Ajoute aussi le secret BACKUP_PASSPHRASE (la phrase qui chiffre la sauvegarde)."; exit 1; fi
          # A space, a line break or quotes copied by mistake around the key: removed here
          SUPABASE_ACCESS_TOKEN="$(printf '%s' "$SUPABASE_ACCESS_TOKEN" | tr -d '[:space:]"'"'"'')"
          export SUPABASE_ACCESS_TOKEN
          case "$SUPABASE_ACCESS_TOKEN" in
            sbp_*) echo "::notice::Clé d'accès reçue : commence bien par sbp_, ${#SUPABASE_ACCESS_TOKEN} caractères." ;;
            *) echo "::error::La clé enregistrée dans SUPABASE_ACCESS_TOKEN ne commence pas par sbp_ (${#SUPABASE_ACCESS_TOKEN} caractères, début : ${SUPABASE_ACCESS_TOKEN:0:3}…). Recopie la clé affichée par Supabase juste après « Create token »."; exit 1 ;;
          esac
          mkdir -p work out
          supabase link --project-ref "$PROJECT_REF" < /dev/null
          supabase db dump --linked --role-only -f work/1-roles.sql < /dev/null
          supabase db dump --linked -f work/2-structure.sql < /dev/null
          supabase db dump --linked --data-only --use-copy -f work/3-donnees.sql < /dev/null
          ls -l work
          test "$(stat -c %s work/2-structure.sql)" -gt 2000
          F="out/yiriclick-$(date -u +%F).tar.gz.gpg"
          tar -C work -czf - . | gpg --batch --yes --symmetric --cipher-algo AES256 --passphrase "$PASS" -o "$F"
          ls -lh out
      - name: Sauvegarde chiffrée
        if: env.HAS_TOKEN != 'true'
        shell: bash   # bash -eo pipefail: a failed pg_dump makes the run fail instead of saving an empty file
        env:
          DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PASS: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ -z "$DB_URL" ] || [ -z "$PASS" ]; then
            echo "::notice::Sauvegarde non configurée : ajoute les secrets SUPABASE_DB_URL et BACKUP_PASSPHRASE (voir README, base v18)."
            exit 0
          fi
          # The address can be pasted exactly as Supabase shows it, with [YOUR-PASSWORD]: the password then comes
          # from the SUPABASE_DB_PASSWORD secret (given to pg_dump through PGPASSWORD, never written in the address).
          DB_URL="$(printf '%s' "$DB_URL" | tr -d '[:space:]')"
          DB_PASSWORD="$(printf '%s' "$DB_PASSWORD" | tr -d '\r\n' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"   # a space or line break copied by mistake
          n=$(printf '%s' "$DB_URL" | grep -o 'postgres\(ql\)\?://' | wc -l)
          if [ "$n" -ne 1 ]; then echo "::error::SUPABASE_DB_URL doit contenir une seule adresse qui commence par postgresql:// (ici : $n). Recolle l'adresse copiée dans Supabase > Connect > Session pooler."; exit 1; fi
          case "$DB_URL" in *pooler.supabase.com*) ;; *) echo "::error::SUPABASE_DB_URL doit être l'adresse « Session pooler » (elle contient pooler.supabase.com)."; exit 1;; esac
          if printf '%s' "$DB_URL" | grep -q 'YOUR-PASSWORD'; then
            if [ -z "$DB_PASSWORD" ]; then echo "::error::L'adresse contient [YOUR-PASSWORD] : ajoute le secret SUPABASE_DB_PASSWORD avec le mot de passe de la base."; exit 1; fi
            DB_URL="$(printf '%s' "$DB_URL" | sed 's/:\[\?YOUR-PASSWORD\]\?@/@/')"
            export PGPASSWORD="$DB_PASSWORD"
            echo "::notice::Mot de passe de la base reçu : ${#DB_PASSWORD} caractères (le contenu reste secret)."
          fi
          export DB_URL
          # Who and where (no password in this line): helps to check the address taken from Supabase
          echo "::notice::Connexion : utilisateur $(printf '%s' "$DB_URL" | sed -E 's#^[a-z]+://([^:@/]+).*#\1#') sur $(printf '%s' "$DB_URL" | sed -E 's#^.*@([^/?]+).*#\1#')"
          mkdir -p out
          F="out/yiriclick-$(date -u +%F).sql.gz.gpg"
          docker run --rm -e DB_URL -e PGPASSWORD postgres:17 sh -c 'pg_dump --no-owner --no-privileges --schema=public --schema=auth --schema=storage "$DB_URL"' \
            | gzip -9 \
            | gpg --batch --yes --symmetric --cipher-algo AES256 --passphrase "$PASS" -o "$F"
          test "$(stat -c %s "$F")" -gt 2000   # an empty or broken dump is only a few bytes
          ls -lh out
      - name: Garder la sauvegarde 90 jours
        if: ${{ hashFiles('out/*') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: sauvegarde-base
          path: out/
          retention-days: 90
          if-no-files-found: ignore
