# Publishes the site on GitHub Pages: on every push, every hour (new shops and products get their
# share pages and enter the sitemap), and by hand from the Actions tab.
# Requires once: Settings > Pages > Build and deployment > Source = "GitHub Actions".
# Site address: https://yiriclick.com/ by default (the SITE_URL variable can override it).
name: Publier le site

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Pages de partage et plan du site
        run: node scripts/build-seo.mjs
        env:
          SITE_URL: ${{ vars.SITE_URL }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
