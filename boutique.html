<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Boutique Yiriclick</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700;800;900&display=swap">
<link rel="stylesheet" href="assets/shop.css">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<meta name="theme-color" content="#10232A">
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="brand" href="./" aria-label="Yiriclick">
      <svg width="28" height="28" viewBox="0 0 160 160" aria-hidden="true"><path d="M76 146 V92 L34 40" fill="none" stroke="#4FC7CF" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/><path d="M76 92 L124 34" fill="none" stroke="#FF7A2E" stroke-width="22" stroke-linecap="round"/><path d="M96 30 H128 V62" fill="none" stroke="#FF7A2E" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span class="word"><span class="a">yiri</span><span class="b">click</span></span>
    </a>
    <div class="prefs">
      <a href="vitrine.html" data-t="showcase">Vitrine</a>
      <select id="prefLang" data-ta="lang"><option value="fr">FR</option><option value="en">EN</option><option value="es">ES</option></select>
      <select id="prefCur" data-ta="cur"><option value="">—</option><option value="XOF">FCFA</option><option value="EUR">€</option><option value="USD">$</option></select>
    </div>
  </div>
</header>

<div id="loading" class="wrap state"><p data-t="loading">Chargement…</p></div>

<div id="missing" class="wrap state" hidden>
  <h1 data-t="notFound">Boutique introuvable</h1>
  <p data-t="notFoundP"></p>
  <a class="btn btn-navy" href="vitrine.html" data-t="back">Voir la vitrine Yiriclick</a>
</div>

<div id="shop" hidden>
  <div class="cover" id="cover"></div>
  <div class="wrap">
    <div class="shop-head">
      <div class="logo" id="logo" aria-hidden="true"></div>
      <div class="shop-id">
        <h1 id="sName"></h1>
        <p id="sPlace"></p>
        <span class="verified"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg><span data-t="verified"></span></span>
      </div>
    </div>
    <p class="about" id="sDesc"></p>
    <div class="tools">
      <label for="q" class="vh" style="position:absolute;left:-9999px" data-t="search"></label>
      <input id="q" type="search" data-tp="search">
      <label for="fCat" style="position:absolute;left:-9999px" data-t="allCats"></label>
      <select id="fCat"></select>
    </div>
    <div class="grid" id="grid"></div>
  </div>
</div>

<footer><div class="wrap"><span data-t="foot">Boutique propulsée par Yiriclick</span><a href="./" data-t="openShop">Ouvrir ma boutique sur Yiriclick</a></div></footer>

<div class="modal" id="pmodal" hidden>
  <div class="modal-bg"></div>
  <div class="mbox" role="dialog" aria-modal="true"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="assets/shop.js"></script>
<script>
(function () {
  var Y = window.YC, shop = null, items = [];
  var params = new URLSearchParams(location.search), slug = (params.get("b") || "").toLowerCase(), pid = params.get("p");

  function render() {
    Y.labels();
    if (!shop) return;
    Y.catOptions(document.getElementById("fCat"), items.map(function (p) { return p.categorie; }));
    var q = Y.norm(document.getElementById("q").value.trim()), c = document.getElementById("fCat").value;
    var list = items.filter(function (p) { return (!c || p.categorie === c) && (!q || Y.norm(p.nom + " " + (p.description || "")).indexOf(q) >= 0); });
    var g = document.getElementById("grid"); g.textContent = "";
    if (!list.length) { g.appendChild(Y.el("div", "empty", items.length ? Y.t("noMatch") : Y.t("noProducts"))); return; }
    list.forEach(function (p) { g.appendChild(Y.card(p, shop, false, function (pp) { Y.openProduct(pp, shop); })); });
  }

  async function start() {
    Y.wirePrefs(render); Y.labels();
    if (!/^[a-z0-9-]{3,40}$/.test(slug)) return notFound();
    var b = await Y.sb.from("boutiques").select("id,slug,nom,description,whatsapp,ville,pays,devise,logo,couverture").eq("slug", slug).maybeSingle();
    if (b.error || !b.data) return notFound();
    shop = b.data;
    var cols = "id,nom,description,prix,devise,categorie,stock,photos,created_at";
    var p = await Y.sb.from("produits").select("prix_avant," + cols).eq("boutique_id", shop.id).order("created_at", { ascending: false });
    if (p.error) p = await Y.sb.from("produits").select(cols).eq("boutique_id", shop.id).order("created_at", { ascending: false });
    items = p.data || [];
    document.title = shop.nom + " · Yiriclick";
    document.getElementById("sName").textContent = shop.nom;
    document.getElementById("sPlace").textContent = [shop.ville, shop.pays].filter(Boolean).join(", ");
    document.getElementById("sDesc").textContent = shop.description || "";
    if (shop.couverture) document.getElementById("cover").style.backgroundImage = "url(\"" + Y.pub(shop.couverture) + "\")";
    var lg = document.getElementById("logo");
    if (shop.logo) lg.style.backgroundImage = "url(\"" + Y.pub(shop.logo) + "\")"; else lg.textContent = shop.nom.charAt(0).toUpperCase();
    document.getElementById("loading").hidden = true; document.getElementById("shop").hidden = false;
    document.getElementById("q").addEventListener("input", render);
    document.getElementById("fCat").addEventListener("change", render);
    render();
    if (pid) { var hit = items.filter(function (x) { return x.id === pid; })[0]; if (hit) Y.openProduct(hit, shop); }
  }
  function notFound() { document.getElementById("loading").hidden = true; document.getElementById("missing").hidden = false; Y.labels(); }
  start();
})();
</script>
</body>
</html>
