<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Boutique Yiriclick</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700;800;900&display=swap">
<link rel="stylesheet" href="assets/shop.css">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<meta name="theme-color" content="#10232A">
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="brand" href="./" aria-label="Yiriclick">
      <svg width="28" height="28" viewBox="0 0 160 160" aria-hidden="true"><path d="M76 146 V92 L34 40" fill="none" stroke="#4FC7CF" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/><path d="M76 92 L124 34" fill="none" stroke="#FF7A2E" stroke-width="22" stroke-linecap="round"/><path d="M96 30 H128 V62" fill="none" stroke="#FF7A2E" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span class="word"><span class="a">yiri</span><span class="b">click</span></span>
    </a>
    <div class="prefs">
      <a href="./" data-t="showcase">Vitrine</a>
      <select id="prefLang" data-ta="lang"><option value="fr">FR</option><option value="en">EN</option><option value="es">ES</option></select>
      <select id="prefCur" data-ta="cur"><option value="">—</option><option value="XOF">FCFA</option><option value="EUR">€</option><option value="USD">$</option></select>
    </div>
  </div>
</header>

<div id="loading" class="wrap state"><p data-t="loading">Chargement…</p></div>

<div id="missing" class="wrap state" hidden>
  <h1 data-t="notFound">Boutique introuvable</h1>
  <p data-t="notFoundP"></p>
  <a class="btn btn-navy" href="./" data-t="back">Voir la vitrine Yiriclick</a>
</div>

<div id="shop" hidden>
  <div class="cover" id="cover"></div>
  <div class="wrap">
    <div class="shop-head">
      <div class="logo" id="logo" aria-hidden="true"></div>
      <div class="shop-id">
        <h1 id="sName"></h1>
        <p class="slogan" id="sSlogan" hidden></p>
        <p class="place" id="sPlace"></p>
        <a class="rating" id="sRating" href="#secAvis" hidden></a>
        <span class="verified"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg><span data-t="verified"></span></span>
      </div>
      <div class="shop-acts">
        <a class="btn btn-brand" id="contact" target="_blank" rel="noopener" hidden data-t="contact"></a>
        <button class="btn btn-ghost" type="button" id="shareBtn" data-t="share"></button>
      </div>
    </div>
    <div class="socials" id="socials" hidden></div>
    <p class="about" id="sDesc"></p>
    <nav class="shop-nav" id="shopNav" data-ta="sections"></nav>

    <section class="ssec" id="secUne" hidden><h2 data-t="sUne"></h2><div class="srail" id="railUne"></div></section>
    <section class="ssec" id="secPromo" hidden><h2 data-t="sPromo"></h2><div class="srail" id="railPromo"></div></section>
    <section class="ssec" id="secNew" hidden><h2 data-t="sNew"></h2><div class="srail" id="railNew"></div></section>

    <section class="ssec" id="secAll">
      <h2 id="allTitle"></h2>
      <div class="tools">
        <label for="q" style="position:absolute;left:-9999px" data-t="search"></label>
        <input id="q" type="search" data-tp="search">
        <label for="fCat" style="position:absolute;left:-9999px" data-t="allCats"></label>
        <select id="fCat"></select>
      </div>
      <div class="grid" id="grid"></div>
    </section>

    <section class="ssec" id="secAvis" hidden><h2 data-t="reviews"></h2><div class="rev-sum" id="revSum"></div><div class="revs" id="revList"></div></section>

    <section class="ssec" id="secInfo" hidden style="padding-bottom:40px">
      <h2 data-t="sInfo"></h2>
      <div class="infos" id="infos"></div>
      <div class="faq" id="faq" hidden></div>
    </section>
  </div>
</div>

<footer><div class="wrap"><span data-t="foot">Boutique propulsée par Yiriclick</span><a href="vendre.html" data-t="openShop">Ouvrir ma boutique sur Yiriclick</a></div></footer>

<div class="modal" id="pmodal" hidden>
  <div class="modal-bg"></div>
  <div class="mbox" role="dialog" aria-modal="true"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="assets/shop.js"></script>
<script>
(function () {
  var Y = window.YC, shop = null, items = [], reviews = [];
  var params = new URLSearchParams(location.search), slug = (params.get("b") || "").toLowerCase(), pid = params.get("p");
  Y.extend({
    fr: { contact: "Contacter sur WhatsApp", share: "Partager la boutique", copied: "Lien copié", sections: "Sections de la boutique", sUne: "À la une", sPromo: "Promotions", sNew: "Nouveautés",
      sAll: "Tous les produits", sInfo: "Infos pratiques", hours: "Horaires", delivery: "Livraison", returns: "Retours et échanges", address: "Adresse", faqT: "Questions fréquentes", site: "Site web",
      waHello: "Bonjour, je vous contacte depuis votre boutique Yiriclick : {u}", nProducts: "{n} produits" },
    en: { contact: "Contact on WhatsApp", share: "Share this shop", copied: "Link copied", sections: "Shop sections", sUne: "Featured", sPromo: "Deals", sNew: "New in",
      sAll: "All products", sInfo: "Good to know", hours: "Opening hours", delivery: "Delivery", returns: "Returns and exchanges", address: "Address", faqT: "Frequently asked questions", site: "Website",
      waHello: "Hello, I am contacting you from your Yiriclick shop: {u}", nProducts: "{n} products" },
    es: { contact: "Contactar por WhatsApp", share: "Compartir la tienda", copied: "Enlace copiado", sections: "Secciones de la tienda", sUne: "Destacados", sPromo: "Ofertas", sNew: "Novedades",
      sAll: "Todos los productos", sInfo: "Información práctica", hours: "Horario", delivery: "Envío", returns: "Devoluciones y cambios", address: "Dirección", faqT: "Preguntas frecuentes", site: "Sitio web",
      waHello: "Hola, le contacto desde su tienda Yiriclick: {u}", nProducts: "{n} productos" }
  });
  function $(id) { return document.getElementById(id); }
  function sec(k) { var s = shop && shop.sections; return !s || s[k] !== false; }
  function shopUrl() { return location.origin + location.pathname + "?b=" + encodeURIComponent(shop.slug); }
  function safeUrl(u) { return /^https:\/\/[^\s"<>]+$/i.test(String(u || "")) ? u : ""; }
  function openP(pp) { Y.openProduct(pp, shop); }

  function rail(id, secId, list, on) {
    var box = $(id); box.textContent = "";
    $(secId).hidden = !on || !list.length;
    list.slice(0, 12).forEach(function (p) { box.appendChild(Y.card(p, shop, false, openP)); });
  }
  function render() {
    Y.labels();
    if (!shop) return;
    var recent = Date.now() - 14 * 864e5;
    rail("railUne", "secUne", items.filter(function (p) { return p.a_la_une; }), sec("une"));
    rail("railPromo", "secPromo", items.filter(function (p) { return Y.discount(p) > 0; }), sec("promos") && items.length >= 6);
    rail("railNew", "secNew", items.filter(function (p) { return new Date(p.created_at).getTime() > recent; }), sec("nouveautes") && items.length >= 6);
    $("allTitle").textContent = Y.t("sAll") + " (" + items.length + ")";
    Y.catOptions($("fCat"), items.map(function (p) { return p.categorie; }));
    var q = Y.norm($("q").value.trim()), c = $("fCat").value;
    var list = items.filter(function (p) { return (!c || p.categorie === c) && (!q || Y.norm(p.nom + " " + (p.description || "")).indexOf(q) >= 0); });
    var g = $("grid"); g.textContent = "";
    if (!list.length) g.appendChild(Y.el("div", "empty", items.length ? Y.t("noMatch") : Y.t("noProducts")));
    else list.forEach(function (p) { g.appendChild(Y.card(p, shop, false, openP)); });
    renderInfos(); renderReviews(); renderNav();
  }
  function renderInfos() {
    var box = $("infos"); box.textContent = "";
    [["hours", shop.horaires], ["delivery", shop.livraison], ["returns", shop.retours], ["address", shop.adresse]].forEach(function (x) {
      if (!x[1]) return; var c = Y.el("div", "icard"); c.appendChild(Y.el("h3", null, Y.t(x[0]))); c.appendChild(Y.el("p", null, x[1])); box.appendChild(c);
    });
    var f = $("faq"); f.textContent = "";
    var faq = Array.isArray(shop.faq) ? shop.faq.filter(function (x) { return x && x.q && x.r; }) : [];
    if (faq.length) { f.appendChild(Y.el("h3", null, Y.t("faqT"))); faq.forEach(function (x) { var d = Y.el("details"); d.appendChild(Y.el("summary", null, x.q)); d.appendChild(Y.el("p", null, x.r)); f.appendChild(d); }); }
    f.hidden = !faq.length;
    $("secInfo").hidden = !sec("infos") || (!box.children.length && !faq.length);
  }
  function stars(n) { var r = Math.round(n); return "★★★★★".slice(0, r) + "☆☆☆☆☆".slice(0, 5 - r); }
  function renderReviews() {
    var n = reviews.length; $("secAvis").hidden = !n;
    var rt = $("sRating"); rt.hidden = !n;
    if (!n) return;
    var avg = reviews.reduce(function (s, r) { return s + r.note; }, 0) / n, avgTxt = avg.toLocaleString(Y.LOCALE[Y.prefs.lang], { maximumFractionDigits: 1 });
    rt.textContent = ""; rt.appendChild(Y.el("span", "stars", stars(avg))); rt.appendChild(document.createTextNode(" " + avgTxt + " · " + Y.t("nReviews", { n: n })));
    rt.setAttribute("aria-label", avgTxt + " / 5 · " + Y.t("nReviews", { n: n }));
    var sm = $("revSum"); sm.textContent = "";
    sm.appendChild(Y.el("span", "big", avgTxt)); var w = Y.el("div"); var s1 = Y.el("div", "stars", stars(avg)); s1.setAttribute("aria-hidden", "true"); w.appendChild(s1); w.appendChild(Y.el("div", "who", Y.t("nReviews", { n: n }))); sm.appendChild(w);
    var box = $("revList"); box.textContent = "";
    reviews.slice(0, 20).forEach(function (r) {
      var c = Y.el("article", "rev"), s2 = Y.el("span", "stars", stars(r.note)); s2.setAttribute("aria-label", r.note + " / 5"); c.appendChild(s2);
      c.appendChild(Y.el("span", "who", r.nom + " · " + new Date(r.created_at).toLocaleDateString(Y.LOCALE[Y.prefs.lang], { day: "numeric", month: "long", year: "numeric" })));
      if (r.commentaire) c.appendChild(Y.el("p", null, r.commentaire));
      if (r.reponse) { var rp = Y.el("div", "reply"); rp.appendChild(Y.el("b", null, Y.t("sellerReply") + " : ")); rp.appendChild(document.createTextNode(r.reponse)); c.appendChild(rp); }
      box.appendChild(c);
    });
  }
  function renderNav() {
    var n = $("shopNav"); n.textContent = "";
    [["secUne", "sUne"], ["secPromo", "sPromo"], ["secNew", "sNew"], ["secAll", "sAll"], ["secAvis", "reviews"], ["secInfo", "sInfo"]].forEach(function (x) {
      if ($(x[0]).hidden) return; var a = Y.el("a", null, Y.t(x[1])); a.href = "#" + x[0]; n.appendChild(a);
    });
    n.hidden = n.children.length < 3;
  }

  async function start() {
    Y.wirePrefs(render); Y.labels();
    if (!/^[a-z0-9-]{3,40}$/.test(slug)) return notFound();
    var b = await Y.sb.from("boutiques").select("*").eq("slug", slug).maybeSingle();
    if (b.error || !b.data) return notFound();
    shop = b.data;
    var cols = "id,boutique_id,nom,description,prix,devise,categorie,stock,photos,created_at";
    var p = await Y.sb.from("produits").select("prix_avant,a_la_une,variantes,solde_prix,solde_debut,solde_fin," + cols).eq("boutique_id", shop.id).order("created_at", { ascending: false });
    if (p.error) p = await Y.sb.from("produits").select("prix_avant,a_la_une,variantes," + cols).eq("boutique_id", shop.id).order("created_at", { ascending: false });
    if (p.error) p = await Y.sb.from("produits").select("prix_avant,a_la_une," + cols).eq("boutique_id", shop.id).order("created_at", { ascending: false });
    if (p.error) p = await Y.sb.from("produits").select("prix_avant," + cols).eq("boutique_id", shop.id).order("created_at", { ascending: false });
    if (p.error) p = await Y.sb.from("produits").select(cols).eq("boutique_id", shop.id).order("created_at", { ascending: false });
    items = Y.prep(p.data || []);
    var av = await Y.sb.from("avis").select("note,commentaire,nom,created_at,reponse").eq("boutique_id", shop.id).order("created_at", { ascending: false }).limit(60);
    reviews = av.error ? [] : (av.data || []);

    var th = Y.THEMES[shop.theme] || Y.THEMES.teal;
    document.body.style.setProperty("--brand", th[0]); document.body.style.setProperty("--brand-ink", th[1]);
    document.title = shop.nom + " · Yiriclick";
    $("sName").textContent = shop.nom;
    if (shop.slogan) { $("sSlogan").textContent = shop.slogan; $("sSlogan").hidden = false; }
    $("sPlace").textContent = [shop.ville, shop.pays].filter(Boolean).join(", ");
    $("sDesc").textContent = shop.description || "";
    if (shop.verifie === false) document.querySelector(".verified").hidden = true;
    if (shop.couverture) $("cover").style.backgroundImage = "url(\"" + Y.pub(shop.couverture) + "\")";
    var lg = $("logo");
    if (shop.logo) lg.style.backgroundImage = "url(\"" + Y.pub(shop.logo) + "\")"; else lg.textContent = shop.nom.charAt(0).toUpperCase();
    var wa = String(shop.whatsapp || "").replace(/\D/g, "");
    if (wa.length >= 8) {
      var c = $("contact"); c.hidden = false;
      c.addEventListener("click", function () { c.href = "https://wa.me/" + wa + "?text=" + encodeURIComponent(Y.t("waHello", { u: shopUrl() })); Y.track("clic_whatsapp", shop.id); });
      c.href = "https://wa.me/" + wa;
    }
    var rs = shop.reseaux || {}, so = $("socials");
    [["facebook", "Facebook"], ["instagram", "Instagram"], ["tiktok", "TikTok"], ["youtube", "YouTube"], ["site", null]].forEach(function (x) {
      var u = safeUrl(rs[x[0]]); if (!u) return; var a = Y.el("a", null, x[1] || Y.t("site")); a.href = u; a.target = "_blank"; a.rel = "noopener"; if (!x[1]) a.setAttribute("data-t", "site"); so.appendChild(a);
    });
    so.hidden = !so.children.length;
    $("shareBtn").addEventListener("click", async function () {
      var u = shopUrl(), b2 = this;
      if (navigator.share) { try { await navigator.share({ title: shop.nom, text: shop.slogan || shop.nom, url: u }); return; } catch (e) { if (e && e.name === "AbortError") return; } }
      try { await navigator.clipboard.writeText(u); b2.textContent = Y.t("copied"); setTimeout(function () { b2.textContent = Y.t("share"); }, 1800); } catch (e) { prompt("", u); }
    });
    $("loading").hidden = true; $("shop").hidden = false;
    $("q").addEventListener("input", render);
    $("fCat").addEventListener("change", render);
    render();
    Y.track("vue_boutique", shop.id);
    if (pid) { var hit = items.filter(function (x) { return x.id === pid; })[0]; if (hit) Y.openProduct(hit, shop); }
  }
  function notFound() { $("loading").hidden = true; $("missing").hidden = false; Y.labels(); }
  start();
})();
</script>
</body>
</html>
